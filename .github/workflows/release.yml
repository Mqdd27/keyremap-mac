name: Release

# Every push to main that touches app code builds the app and publishes a new patch release.
on:
  push:
    branches: [main]
    paths: [main.swift, icon.swift, build.sh]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Next version (latest release + 1 patch)
        run: |
          last=$(gh release view --json tagName -q .tagName 2>/dev/null || echo v0.0.0)
          v=${last#v}
          echo "VERSION=${v%.*}.$(( ${v##*.} + 1 ))" >> "$GITHUB_ENV"

      - name: Build
        run: |
          sh build.sh
          ditto -c -k --keepParent "KeyRemap Lite.app" KeyRemap-Lite.zip

      - name: Publish release
        run: |
          gh release create "v$VERSION" KeyRemap-Lite.zip \
            --target "$GITHUB_SHA" \
            --title "KeyRemap Lite $VERSION" \
            --generate-notes \
            --notes '**Install:** unzip, move to /Applications. Not notarized, so on first launch use System Settings → Privacy & Security → Open Anyway, or run `xattr -dr com.apple.quarantine "/Applications/KeyRemap Lite.app"`'
